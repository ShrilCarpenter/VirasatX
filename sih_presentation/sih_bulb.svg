<!-- SIH Brain Bulb Illustration for Title Slide -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 360" width="320" height="360">
  <g transform="translate(160, 160)">
    <!-- Light Rays -->
    <line x1="0" y1="-140" x2="0" y2="-115" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="-100" x2="80" y2="-80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="0" x2="115" y2="0" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="80" y2="80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="-100" y1="-100" x2="-80" y2="-80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="-140" y1="0" x2="-115" y2="0" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="-100" y1="100" x2="-80" y2="80" stroke="#475569" stroke-width="6" stroke-linecap="round"/>

    <!-- Light Bulb Outline & Hexagonal Background -->
    <path d="M 0 -105 C 65 -105 105 -55 105 0 C 105 40 75 65 60 90 L -60 90 C -75 65 -105 40 -105 0 C -105 -55 -65 -105 0 -105 Z" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Left Brain / Circuit in Orange -->
    <path d="M -5 -90 C -45 -90 -85 -60 -85 0 C -85 35 -60 55 -45 80 L -5 80 Z" fill="#F97316"/>
    <!-- Orange Circuit Lines -->
    <circle cx="-35" cy="-50" r="4" fill="#FFFFFF"/>
    <line x1="-35" y1="-50" x2="-35" y2="-20" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="-60" cy="-10" r="4" fill="#FFFFFF"/>
    <line x1="-60" y1="-10" x2="-25" y2="-10" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="-45" cy="30" r="4" fill="#FFFFFF"/>
    <line x1="-45" y1="30" x2="-45" y2="60" stroke="#FFFFFF" stroke-width="3"/>
    <line x1="-25" y1="20" x2="-25" y2="70" stroke="#FFFFFF" stroke-width="3"/>

    <!-- Right Binary in Green -->
    <path d="M 5 -90 C 45 -90 85 -60 85 0 C 85 35 60 55 45 80 L 5 80 Z" fill="#15803D"/>
    <!-- Binary Code Text -->
    <text x="18" y="-60" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">1010</text>
    <text x="18" y="-35" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">01010</text>
    <text x="18" y="-10" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">101010</text>
    <text x="18" y="15" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">010101</text>
    <text x="18" y="40" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">10101</text>
    <text x="18" y="65" font-family="monospace" font-size="18" font-weight="900" fill="#FFFFFF">010</text>

    <!-- Bulb Base & Filament -->
    <rect x="-45" y="95" width="90" height="12" rx="4" fill="#475569"/>
    <rect x="-35" y="112" width="70" height="10" rx="3" fill="#475569"/>
    <rect x="-20" y="127" width="40" height="8" rx="2" fill="#475569"/>

    <!-- SIH Text below bulb -->
    <text x="0" y="165" font-family="Arial, sans-serif" font-size="26" font-weight="900" fill="#334155" text-anchor="middle" letter-spacing="3">SIH</text>
    <line x1="-30" y1="175" x2="30" y2="175" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <line x1="-18" y1="183" x2="18" y2="183" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
